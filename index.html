<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- favicon как data: URL — не создаёт запроса /favicon.ico и не даёт 404 в консоли -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23111827' stroke='%2322d3ee' stroke-width='6'/%3E%3Cline x1='50' y1='10' x2='50' y2='90' stroke='%2322d3ee' stroke-width='5'/%3E%3Cline x1='10' y1='50' x2='90' y2='50' stroke='%2322d3ee' stroke-width='5'/%3E%3C/svg%3E" />
    <title>TotalQuadro Coordinate Marker</title>
    <!-- ЭТАП 1.3 (PWA): манифест и мета для установки/офлайн-режима.
         vite-plugin-pwa генерирует sw.js и manifest.webmanifest при сборке;
         в dev-режиме plugin devOptions включает SW автоматически. -->
    <!-- ФИКС 404 на GitHub Pages: абсолютный путь /manifest.webmanifest резолвится
         в корень домена (https://<user>.github.io/...), минуя подпапку /<repo>/,
         где лежит собранный манифест. Относительный путь работает и на Pages
         (<base href> из vite base:"./" подставляет /<repo>/), и с поддомена. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#111827" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <style>
      /* Фоновый цвет сразу, чтобы не было «белого листа» до загрузки React */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #111827; /* gray-900 — цвет приложения */
        color: #ffffff;
      }
      #boot {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-family: system-ui, sans-serif;
        font-size: 14px;
        color: #22d3ee;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Загрузка TotalQuadro Coordinate Marker…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
